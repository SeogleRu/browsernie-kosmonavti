<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Браузерные космонавты — Побег от предателя</title>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            position: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #03060b;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* ---------- МЕНЮ ---------- */
        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #0a0f1e, #03060b);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 100;
            padding: 15px;
            overflow-y: auto;
        }
        #menu h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            margin: 0 0 1rem 0;
            text-shadow: 0 0 20px cyan, 0 0 40px blue;
            letter-spacing: 4px;
            color: #e0f0ff;
            text-align: center;
        }
        .menu-panel {
            background: rgba(10, 20, 40, 0.85);
            border: 2px solid #3a6ea5;
            border-radius: 24px;
            padding: clamp(1rem, 4vw, 2rem) clamp(1.2rem, 5vw, 3rem);
            box-shadow: 0 0 50px rgba(0, 180, 255, 0.3);
            display: flex;
            flex-direction: column;
            gap: clamp(0.8rem, 3vw, 1.5rem);
            width: min(95%, 420px);
        }
        .menu-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }
        .menu-row label {
            font-size: clamp(0.95rem, 3.5vw, 1.3rem);
            color: #aad0ff;
            flex: 1 1 100px;
        }
        select, input {
            background: #0f1a2b;
            border: 2px solid #2f5a8c;
            color: white;
            padding: clamp(0.5rem, 2vw, 0.7rem) clamp(0.7rem, 3vw, 1rem);
            border-radius: 12px;
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            flex: 1 1 140px;
            min-width: 0;
            cursor: pointer;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        select:hover, input:hover, select:focus, input:focus {
            border-color: #5a9eff;
        }
        #playBtn {
            background: #1e4b7a;
            border: 2px solid #7abfff;
            color: white;
            font-size: clamp(1.3rem, 5vw, 2rem);
            font-weight: bold;
            padding: clamp(0.8rem, 3vw, 1rem);
            border-radius: 20px;
            cursor: pointer;
            letter-spacing: 4px;
            transition: all 0.2s;
            box-shadow: 0 0 20px #2f8cff;
            margin-top: 0.5rem;
            font-family: inherit;
            touch-action: manipulation;
        }
        #playBtn:hover, #playBtn:active {
            background: #2f6eb0;
            box-shadow: 0 0 40px #4faaff;
            transform: scale(1.02);
        }
        /* ---------- HUD ---------- */
        #hud {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            left: max(10px, env(safe-area-inset-left));
            color: white;
            text-shadow: 2px 2px 4px black;
            font-size: clamp(0.8rem, 3.5vw, 1.5rem);
            background: rgba(0,0,0,0.55);
            padding: clamp(6px, 2vw, 10px) clamp(12px, 4vw, 25px);
            border-radius: 30px;
            border-left: 4px solid #00ccff;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }
        #roleDisplay {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            right: max(10px, env(safe-area-inset-right));
            color: #ffcc00;
            font-size: clamp(0.8rem, 3.5vw, 1.5rem);
            font-weight: bold;
            text-shadow: 0 0 15px orange;
            background: rgba(0,0,0,0.6);
            padding: clamp(6px, 2vw, 10px) clamp(12px, 4vw, 25px);
            border-radius: 20px;
            border: 2px solid #ffaa00;
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: clamp(1rem, 4vw, 2rem);
            background: rgba(0,0,0,0.85);
            padding: clamp(15px, 5vw, 25px) clamp(20px, 6vw, 50px);
            border-radius: 24px;
            text-align: center;
            z-index: 20;
            border: 3px solid red;
            display: none;
            max-width: 90%;
            text-shadow: 0 0 10px red;
        }
        .hidden {
            display: none !important;
        }
        /* ---------- КНОПКИ ТАЧ-УПРАВЛЕНИЯ ---------- */
        #touchControls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
            display: none;
        }
        #touchControls.active {
            display: block;
        }
        .joystick-zone {
            position: absolute;
            bottom: max(20px, env(safe-area-inset-bottom));
            width: 140px;
            height: 140px;
            pointer-events: auto;
            touch-action: none;
        }
        #joystickLeft {
            left: max(20px, env(safe-area-inset-left));
        }
        #joystickBase {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(50, 100, 180, 0.25);
            border: 3px solid rgba(120, 180, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.4);
        }
        #joystickKnob {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #7abfff, #2f6eb0);
            border: 2px solid #aad0ff;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #4faaff;
            pointer-events: none;
        }
        #lookZone {
            position: absolute;
            top: 0;
            right: 0;
            width: 55%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
        }
        /* Адаптация под ландшафт */
        @media (orientation: landscape) and (max-height: 500px) {
            .joystick-zone {
                width: 110px;
                height: 110px;
                bottom: max(10px, env(safe-area-inset-bottom));
            }
            #joystickKnob {
                width: 48px;
                height: 48px;
            }
        }
        /* Индикация мобильного */
        .mobile-hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 0.75rem;
            z-index: 5;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="menu">
        <h1>БРАУЗЕРНЫЕ КОСМОНАВТЫ</h1>
        <div class="menu-panel">
            <div class="menu-row">
                <label>Карта:</label>
                <select id="mapSelect">
                    <option value="small">Малая</option>
                    <option value="medium" selected>Средняя</option>
                    <option value="large">Большая</option>
                </select>
            </div>
            <div class="menu-row">
                <label>Режим:</label>
                <select id="roleSelect">
                    <option value="crew" selected>Космонавт</option>
                    <option value="impostor">Предатель</option>
                </select>
            </div>
            <div class="menu-row">
                <label>Время (мин):</label>
                <input type="number" id="timeInput" value="5" min="1" max="30" step="1" inputmode="numeric">
            </div>
            <button id="playBtn" type="button">ИГРАТЬ!</button>
        </div>
    </div>

    <div id="hud">Время: <span id="timer">5:00</span> | Союзников: <span id="allyCount">4</span></div>
    <div id="roleDisplay"></div>
    <div id="message"></div>

    <!-- Тач-управление -->
    <div id="touchControls">
        <div class="joystick-zone" id="joystickLeft">
            <div id="joystickBase">
                <div id="joystickKnob"></div>
            </div>
        </div>
        <div id="lookZone"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== ОПРЕДЕЛЕНИЕ МОБИЛЬНОГО УСТРОЙСТВА ====================
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
                        || ('ontouchstart' in window && navigator.maxTouchPoints > 1);
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        // ==================== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ====================
        let scene, camera, renderer;
        let player = { obj: null, isImpostor: false };
        let allies = [];
        let impostorObj = null;
        let gameActive = false;
        let timeLeft = 300;
        let gameTimerInterval = null;
        const clock = new THREE.Clock();
        let mapSize = 30;

        // Ссылки на DOM
        const menuEl = document.getElementById('menu');
        const playBtn = document.getElementById('playBtn');
        const mapSelect = document.getElementById('mapSelect');
        const roleSelect = document.getElementById('roleSelect');
        const timeInput = document.getElementById('timeInput');
        const timerSpan = document.getElementById('timer');
        const allyCountSpan = document.getElementById('allyCount');
        const roleDisplay = document.getElementById('roleDisplay');
        const messageEl = document.getElementById('message');
        const touchControls = document.getElementById('touchControls');
        const joystickBase = document.getElementById('joystickBase');
        const joystickKnob = document.getElementById('joystickKnob');
        const lookZone = document.getElementById('lookZone');
        const canvas = document.getElementById('gameCanvas');

        // ==================== ИНИЦИАЛИЗАЦИЯ THREE.JS ====================
        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a20);
            scene.fog = new THREE.FogExp2(0x0a0a20, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, 1.7, 0);
            camera.rotation.order = 'YXZ';

            // Оптимизация рендерера для мобильных
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas,
                antialias: !isMobile, // отключаем сглаживание на мобильных для производительности
                powerPreference: 'high-performance',
                alpha: false,
                stencil: false,
                depth: true
            });
            
            // Ограничиваем pixel ratio для мобильных (максимум 1.5)
            const pixelRatio = isMobile ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2);
            renderer.setPixelRatio(pixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // Тени только на десктопе (на мобильных сильно нагружают)
            if (!isMobile) {
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            } else {
                renderer.shadowMap.enabled = false;
            }
            
            renderer.outputEncoding = THREE.sRGBEncoding;
        }

        // ==================== ОСВЕЩЕНИЕ ====================
        function addLights() {
            const ambient = new THREE.AmbientLight(0x505070, 1.2);
            scene.add(ambient);

            const mainLight = new THREE.DirectionalLight(0xffffff, 0.9);
            mainLight.position.set(10, 20, 5);
            if (!isMobile) {
                mainLight.castShadow = true;
                mainLight.shadow.mapSize.width = 1024;
                mainLight.shadow.mapSize.height = 1024;
                const d = 30;
                mainLight.shadow.camera.left = -d;
                mainLight.shadow.camera.right = d;
                mainLight.shadow.camera.top = d;
                mainLight.shadow.camera.bottom = -d;
                mainLight.shadow.camera.far = 50;
            }
            scene.add(mainLight);

            const fillLight = new THREE.PointLight(0x4466ff, 0.4);
            fillLight.position.set(-5, 3, 5);
            scene.add(fillLight);
        }

        // ==================== СОЗДАНИЕ КАРТЫ ====================
        function createMap(type) {
            // Удаляем старую карту
            const oldGround = scene.getObjectByName('ground');
            if (oldGround) scene.remove(oldGround);
            
            // Удаляем все стены
            const wallsToRemove = [];
            scene.traverse(obj => {
                if (obj.name === 'wall') wallsToRemove.push(obj);
            });
            wallsToRemove.forEach(w => scene.remove(w));

            let sizeX, sizeZ;
            const wallHeight = 3;
            const wallThickness = 1;

            if (type === 'small') { sizeX = 20; sizeZ = 20; }
            else if (type === 'medium') { sizeX = 30; sizeZ = 30; }
            else { sizeX = 45; sizeZ = 45; }

            mapSize = Math.min(sizeX, sizeZ);

            // Пол
            const groundGeo = new THREE.BoxGeometry(sizeX, 0.5, sizeZ);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x2a2a4a });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.name = 'ground';
            ground.position.y = -0.25;
            ground.receiveShadow = !isMobile;
            scene.add(ground);

            // Стены
            const wallMat = new THREE.MeshLambertMaterial({ color: 0x4a6a9a });

            function addWall(x, z, w, d) {
                const wallGeo = new THREE.BoxGeometry(w, wallHeight, d);
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(x, wallHeight / 2, z);
                wall.castShadow = !isMobile;
                wall.receiveShadow = !isMobile;
                wall.name = 'wall';
                scene.add(wall);
            }

            const halfX = sizeX / 2;
            const halfZ = sizeZ / 2;
            addWall(0, -halfZ, sizeX, wallThickness);
            addWall(0, halfZ, sizeX, wallThickness);
            addWall(-halfX, 0, wallThickness, sizeZ);
            addWall(halfX, 0, wallThickness, sizeZ);

            if (type === 'medium') {
                addWall(-5, -5, 4, 1);
                addWall(5, 5, 1, 4);
                addWall(0, 8, 3, 0.5);
                addWall(-8, 0, 0.5, 5);
            } else if (type === 'large') {
                addWall(-10, -10, 8, 1);
                addWall(10, 10, 8, 1);
                addWall(-10, 10, 1, 8);
                addWall(10, -10, 1, 8);
                addWall(0, -5, 5, 1);
                addWall(0, 5, 5, 1);
                addWall(-5, 0, 1, 5);
                addWall(5, 0, 1, 5);
                addWall(15, 0, 1, 6);
                addWall(-15, 0, 1, 6);
            } else {
                addWall(3, 3, 2, 1);
                addWall(-3, -3, 1, 2);
            }
        }

        // ==================== СОЗДАНИЕ ПЕРСОНАЖА ====================
        function createAstronaut(color = 0x44aaff, isImpostor = false) {
            const group = new THREE.Group();

            // Тело — используем упрощённую геометрию для мобильных
            const bodyGeo = new THREE.CapsuleGeometry(0.7, 0.7, isMobile ? 2 : 4, isMobile ? 6 : 8);
            const bodyMat = new THREE.MeshLambertMaterial({ color: color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = !isMobile;
            body.receiveShadow = !isMobile;
            body.position.y = 0.8;
            group.add(body);

            // Визор
            const visorGeo = new THREE.SphereGeometry(0.4, isMobile ? 6 : 8, isMobile ? 6 : 8);
            const visorMat = new THREE.MeshLambertMaterial({ 
                color: 0x111122, 
                emissive: isImpostor ? 0x440000 : 0x112233
            });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.castShadow = false;
            visor.position.set(0, 1.1, 0.55);
            visor.scale.set(0.9, 0.6, 0.4);
            group.add(visor);

            // Рюкзак
            const backpackGeo = new THREE.BoxGeometry(0.6, 0.8, 0.4);
            const backpackMat = new THREE.MeshLambertMaterial({ color: 0xcccccc });
            const backpack = new THREE.Mesh(backpackGeo, backpackMat);
            backpack.castShadow = !isMobile;
            backpack.position.set(0, 0.9, -0.55);
            group.add(backpack);

            // Ноги
            const legGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.4, 6);
            const legMat = new THREE.MeshLambertMaterial({ color: color });
            const legL = new THREE.Mesh(legGeo, legMat);
            legL.position.set(-0.3, 0.3, 0);
            group.add(legL);
            const legR = new THREE.Mesh(legGeo, legMat);
            legR.position.set(0.3, 0.3, 0);
            group.add(legR);

            // Если предатель — рожки
            if (isImpostor) {
                const spikeGeo = new THREE.ConeGeometry(0.2, 0.5, 4);
                const spikeMat = new THREE.MeshLambertMaterial({ color: 0xaa2222, emissive: 0x440000 });
                const spikeL = new THREE.Mesh(spikeGeo, spikeMat);
                spikeL.position.set(-0.35, 1.6, 0.1);
                spikeL.rotation.x = 0.3;
                group.add(spikeL);
                const spikeR = new THREE.Mesh(spikeGeo, spikeMat);
                spikeR.position.set(0.35, 1.6, 0.1);
                spikeR.rotation.x = 0.3;
                group.add(spikeR);
            }

            group.userData = { isImpostor, color };
            return group;
        }

        // ==================== СЛУЧАЙНАЯ ТОЧКА СПАВНА ====================
        function getRandomSpawnPoint(size) {
            const half = size / 2 - 3;
            return new THREE.Vector3(
                (Math.random() - 0.5) * half * 1.4,
                0,
                (Math.random() - 0.5) * half * 1.4
            );
        }

        // ==================== ОЧИСТКА ПЕРСОНАЖЕЙ ====================
        function clearCharacters() {
            allies.forEach(a => scene.remove(a));
            allies = [];
            if (impostorObj) { scene.remove(impostorObj); impostorObj = null; }
            if (player.obj) { scene.remove(player.obj); player.obj = null; }
        }

        // ==================== ЗАПУСК ИГРЫ ====================
        function startGame() {
            try {
                // Сброс
                clearCharacters();
                if (gameTimerInterval) clearInterval(gameTimerInterval);

                const mapType = mapSelect.value;
                const role = roleSelect.value;
                let minutes = parseFloat(timeInput.value);
                if (isNaN(minutes) || minutes < 1) minutes = 5;
                if (minutes > 30) minutes = 30;

                timeLeft = Math.floor(minutes * 60);
                updateTimerDisplay();

                // Карта
                let size = 30;
                if (mapType === 'small') size = 20;
                else if (mapType === 'large') size = 45;

                createMap(mapType);

                // Игрок
                const playerIsImpostor = (role === 'impostor');
                player.isImpostor = playerIsImpostor;
                const playerColor = playerIsImpostor ? 0xaa2222 : 0x44aaff;
                
                player.obj = createAstronaut(playerColor, playerIsImpostor);
                player.obj.position.set(0, 0, 0);
                scene.add(player.obj);

                // Сброс камеры
                camera.position.set(0, 1.7, 0);
                camera.rotation.set(0, 0, 0);
                cameraYaw = 0;
                cameraPitch = 0;

                // Союзники
                const allyCount = 4;
                if (playerIsImpostor) {
                    // Игрок — предатель, союзники — цели
                    for (let i = 0; i < allyCount; i++) {
                        const ally = createAstronaut(0x44aaff, false);
                        let pos;
                        let attempts = 0;
                        do {
                            pos = getRandomSpawnPoint(size);
                            attempts++;
                        } while (pos.distanceTo(player.obj.position) < 6 && attempts < 20);
                        ally.position.copy(pos);
                        ally.userData = { isImpostor: false, alive: true, speed: 2.8 + Math.random() * 1.2 };
                        scene.add(ally);
                        allies.push(ally);
                    }
                } else {
                    // Игрок — космонавт, союзники + предатель
                    for (let i = 0; i < allyCount; i++) {
                        const ally = createAstronaut(0x44aaff, false);
                        let pos;
                        let attempts = 0;
                        do {
                            pos = getRandomSpawnPoint(size);
                            attempts++;
                        } while (pos.distanceTo(player.obj.position) < 5 && attempts < 20);
                        ally.position.copy(pos);
                        ally.userData = { isImpostor: false, alive: true, speed: 2.8 + Math.random() * 1.2 };
                        scene.add(ally);
                        allies.push(ally);
                    }
                    // Предатель
                    impostorObj = createAstronaut(0xaa2222, true);
                    let impPos;
                    let attempts = 0;
                    do {
                        impPos = getRandomSpawnPoint(size);
                        attempts++;
                    } while (impPos.distanceTo(player.obj.position) < 12 && attempts < 30);
                    impostorObj.position.copy(impPos);
                    impostorObj.userData = { isImpostor: true, speed: 3.8 };
                    scene.add(impostorObj);
                }

                updateAllyCount();

                roleDisplay.textContent = playerIsImpostor ? 'ВЫ — ПРЕДАТЕЛЬ' : 'ВЫ — КОСМОНАВТ';
                roleDisplay.style.color = playerIsImpostor ? '#ff5555' : '#aaffaa';
                messageEl.style.display = 'none';

                // Показать тач-управление на мобильных
                if (isTouchDevice) {
                    touchControls.classList.add('active');
                }

                // Запуск таймера
                gameActive = true;
                gameTimerInterval = setInterval(() => {
                    if (!gameActive) return;
                    timeLeft--;
                    updateTimerDisplay();
                    if (timeLeft <= 0) {
                        if (!player.isImpostor) {
                            endGame(true, 'ВЫ ВЫЖИЛИ! ПОБЕДА КОСМОНАВТОВ!');
                        } else {
                            endGame(false, 'ВРЕМЯ ВЫШЛО... ПРЕДАТЕЛЬ ПРОИГРАЛ.');
                        }
                    }
                }, 1000);

                // Скрываем меню
                menuEl.classList.add('hidden');
                
                // Сброс джойстика
                joystickActive = false;
                moveVec.set(0, 0);

            } catch (e) {
                console.error('Ошибка запуска игры:', e);
                alert('Ошибка при запуске игры: ' + e.message);
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = Math.floor(timeLeft % 60);
            timerSpan.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updateAllyCount() {
            const aliveCount = allies.filter(a => a.userData.alive !== false).length;
            allyCountSpan.textContent = aliveCount;
            return aliveCount;
        }

        // ==================== ЗАВЕРШЕНИЕ ИГРЫ ====================
        function endGame(win, message) {
            if (!gameActive) return;
            gameActive = false;
            if (gameTimerInterval) clearInterval(gameTimerInterval);

            messageEl.textContent = message;
            messageEl.style.display = 'block';
            messageEl.style.borderColor = win ? '#00ffaa' : '#ff3333';
            messageEl.style.color = win ? '#aaffaa' : '#ffaaaa';

            setTimeout(() => {
                menuEl.classList.remove('hidden');
                messageEl.style.display = 'none';
                touchControls.classList.remove('active');
                clearCharacters();
                gameActive = false;
            }, 2500);
        }

        // ==================== УПРАВЛЕНИЕ: КЛАВИАТУРА ====================
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
        }, { passive: false });
        
        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // ==================== УПРАВЛЕНИЕ: МЫШЬ (DESKTOP) ====================
        let cameraYaw = 0, cameraPitch = 0;
        const mouseSensitivity = 0.0022;
        let isPointerLocked = false;

        canvas.addEventListener('click', () => {
            if (gameActive && !isTouchDevice && !isPointerLocked) {
                canvas.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === canvas;
        });

        document.addEventListener('mousemove', (e) => {
            if (!gameActive || isTouchDevice) return;
            if (isPointerLocked || document.pointerLockElement === canvas) {
                cameraYaw -= e.movementX * mouseSensitivity;
                cameraPitch -= e.movementY * mouseSensitivity;
                cameraPitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, cameraPitch));
            }
        });

        // ==================== УПРАВЛЕНИЕ: ТАЧ (MOBILE) ====================
        let joystickActive = false;
        let joystickTouchId = null;
        let joystickStart = { x: 0, y: 0 };
        const moveVec = new THREE.Vector2();
        const JOYSTICK_MAX_DIST = 50;

        let lookTouchId = null;
        let lookLast = { x: 0, y: 0 };
        const touchLookSensitivity = 0.005;

        // Джойстик
        joystickBase.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (joystickTouchId !== null) return;
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            joystickActive = true;
            const rect = joystickBase.getBoundingClientRect();
            joystickStart.x = rect.left + rect.width / 2;
            joystickStart.y = rect.top + rect.height / 2;
            updateJoystick(touch.clientX, touch.clientY);
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                
                // Джойстик
                if (touch.identifier === joystickTouchId) {
                    e.preventDefault();
                    updateJoystick(touch.clientX, touch.clientY);
                }
                
                // Обзор
                if (touch.identifier === lookTouchId) {
                    e.preventDefault();
                    const dx = touch.clientX - lookLast.x;
                    const dy = touch.clientY - lookLast.y;
                    cameraYaw -= dx * touchLookSensitivity;
                    cameraPitch -= dy * touchLookSensitivity;
                    cameraPitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, cameraPitch));
                    lookLast.x = touch.clientX;
                    lookLast.y = touch.clientY;
                }
            }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    joystickTouchId = null;
                    joystickActive = false;
                    moveVec.set(0, 0);
                    resetJoystickKnob();
                }
                if (touch.identifier === lookTouchId) {
                    lookTouchId = null;
                }
            }
        }, { passive: false });

        document.addEventListener('touchcancel', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    joystickTouchId = null;
                    joystickActive = false;
                    moveVec.set(0, 0);
                    resetJoystickKnob();
                }
                if (touch.identifier === lookTouchId) {
                    lookTouchId = null;
                }
            }
        }, { passive: false });

        // Зона обзора
        lookZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (lookTouchId !== null) return;
            const touch = e.changedTouches[0];
            lookTouchId = touch.identifier;
            lookLast.x = touch.clientX;
            lookLast.y = touch.clientY;
        }, { passive: false });

        function updateJoystick(clientX, clientY) {
            let dx = clientX - joystickStart.x;
            let dy = clientY - joystickStart.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist > JOYSTICK_MAX_DIST) {
                dx = (dx / dist) * JOYSTICK_MAX_DIST;
                dy = (dy / dist) * JOYSTICK_MAX_DIST;
            }
            
            // Визуальное положение кноба
            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            
            // Нормализованные значения (-1..1)
            moveVec.x = dx / JOYSTICK_MAX_DIST;
            moveVec.y = dy / JOYSTICK_MAX_DIST;
        }

        function resetJoystickKnob() {
            joystickKnob.style.transform = 'translate(-50%, -50%)';
        }

        // ==================== ОБНОВЛЕНИЕ ИГРЫ ====================
        function updateGame(delta) {
            if (!gameActive || !player.obj) return;

            const speed = player.isImpostor ? 6.0 : 5.0;
            const moveDir = new THREE.Vector3();

            // Направления камеры (без наклона)
            const forward = new THREE.Vector3(-Math.sin(cameraYaw), 0, -Math.cos(cameraYaw));
            const right = new THREE.Vector3(Math.cos(cameraYaw), 0, -Math.sin(cameraYaw));

            // Ввод: клавиатура
            if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(forward);
            if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(forward);
            if (keys['KeyA'] || keys['ArrowLeft']) moveDir.sub(right);
            if (keys['KeyD'] || keys['ArrowRight']) moveDir.add(right);

            // Ввод: джойстик (мобильный)
            if (joystickActive && (Math.abs(moveVec.x) > 0.1 || Math.abs(moveVec.y) > 0.1)) {
                // moveVec.y: вверх = -1, вниз = +1
                // Для движения: вверх джойстика = вперёд
                moveDir.add(forward.clone().multiplyScalar(-moveVec.y));
                moveDir.add(right.clone().multiplyScalar(moveVec.x));
            }

            if (moveDir.lengthSq() > 0) {
                moveDir.normalize();
                const newPos = player.obj.position.clone().add(moveDir.multiplyScalar(speed * delta));
                // Ограничение по границам
                const limit = mapSize / 2 - 1.5;
                newPos.x = Math.max(-limit, Math.min(limit, newPos.x));
                newPos.z = Math.max(-limit, Math.min(limit, newPos.z));
                player.obj.position.copy(newPos);
            }

            // Камера от первого лица
            camera.position.set(player.obj.position.x, player.obj.position.y + 1.7, player.obj.position.z);
            camera.rotation.y = cameraYaw;
            camera.rotation.x = cameraPitch;

            // ===== ИИ =====
            if (player.isImpostor) {
                // Союзники убегают от игрока
                allies.forEach(ally => {
                    if (!ally.userData.alive) return;
                    
                    const distToPlayer = ally.position.distanceTo(player.obj.position);
                    const dirAway = new THREE.Vector3().subVectors(ally.position, player.obj.position);
                    dirAway.y = 0;
                    
                    if (dirAway.lengthSq() < 0.01) {
                        dirAway.set(Math.random() - 0.5, 0, Math.random() - 0.5);
                    }
                    dirAway.normalize();
                    
                    let allySpeed = ally.userData.speed;
                    if (distToPlayer < 10) {
                        allySpeed *= 1.7;
                        // Паника — небольшое случайное отклонение
                        dirAway.x += (Math.random() - 0.5) * 0.6;
                        dirAway.z += (Math.random() - 0.5) * 0.6;
                        dirAway.normalize();
                    }
                    
                    const newPos = ally.position.clone().add(dirAway.multiplyScalar(allySpeed * delta));
                    const limit = mapSize / 2 - 1.5;
                    newPos.x = Math.max(-limit, Math.min(limit, newPos.x));
                    newPos.z = Math.max(-limit, Math.min(limit, newPos.z));
                    ally.position.copy(newPos);
                    
                    // Поимка союзника
                    if (distToPlayer < 1.8) {
                        ally.userData.alive = false;
                        scene.remove(ally);
                        const left = updateAllyCount();
                        if (left === 0) {
                            endGame(true, 'ВЫ СЪЕЛИ ВСЕХ! ПОБЕДА ПРЕДАТЕЛЯ!');
                        }
                    }
                });
            } else {
                // Предатель преследует
                if (impostorObj) {
                    let target = null;
                    let minDist = Infinity;
                    
                    allies.forEach(ally => {
                        if (!ally.userData.alive) return;
                        const d = impostorObj.position.distanceTo(ally.position);
                        if (d < minDist) { minDist = d; target = ally; }
                    });
                    
                    const dToPlayer = impostorObj.position.distanceTo(player.obj.position);
                    if (dToPlayer < minDist) {
                        minDist = dToPlayer;
                        target = player.obj;
                    }
                    
                    if (target) {
                        const dir = new THREE.Vector3().subVectors(target.position, impostorObj.position);
                        dir.y = 0;
                        if (dir.lengthSq() > 0.001) {
                            dir.normalize();
                            const newPos = impostorObj.position.clone().add(dir.multiplyScalar(impostorObj.userData.speed * delta));
                            impostorObj.position.copy(newPos);
                        }
                        
                        // Поимка игрока
                        if (target === player.obj && dToPlayer < 1.8) {
                            endGame(false, 'ВАС СЪЕЛ ПРЕДАТЕЛЬ! ИГРА ОКОНЧЕНА.');
                            return;
                        }
                        
                        // Поимка союзника
                        if (target !== player.obj && impostorObj.position.distanceTo(target.position) < 1.8) {
                            target.userData.alive = false;
                            scene.remove(target);
                            const left = updateAllyCount();
                            if (left === 0) {
                                endGame(false, 'ПРЕДАТЕЛЬ СЪЕЛ ВСЕХ СОЮЗНИКОВ... ВЫ ПРОИГРАЛИ.');
                            }
                        }
                    }
                }
            }

            updateAllyCount();
        }

        // ==================== АНИМАЦИОННЫЙ ЦИКЛ ====================
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.05); // ограничение delta для стабильности
            
            if (gameActive) {
                updateGame(delta);
            }
            
            renderer.render(scene, camera);
        }

        // ==================== РАЗМЕР ОКНА ====================
        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            
            const pixelRatio = isMobile ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2);
            renderer.setPixelRatio(pixelRatio);
            renderer.setSize(w, h);
        }

        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(onResize, 200);
        });

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        function init() {
            initScene();
            addLights();
            createMap('medium');

            // Обработчик кнопки "Играть" — исправлено: используется addEventListener с 'click' и 'touchend'
            const handlePlay = (e) => {
                e.preventDefault();
                e.stopPropagation();
                startGame();
            };
            
            playBtn.addEventListener('click', handlePlay);
            // Дополнительно для мобильных, чтобы кнопка срабатывала моментально
            playBtn.addEventListener('touchend', (e) => {
                e.preventDefault();
                handlePlay(e);
            }, { passive: false });

            // Запуск
            animate();
        }

        // Запуск после загрузки страницы
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
